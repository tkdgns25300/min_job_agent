[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minjob-agent"
version = "0.0.0"
description = "교역자 청빙 공고 수집 크롤러 (min_job 리뷰 큐 적재)"
requires-python = ">=3.12"
# 0-1a는 표준 라이브러리만 사용. google-genai는 0-1c(Gemini 래퍼)에서 추가.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0"]

[project.scripts]
minjob-agent = "minjob_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "RUF", "TID"]

# 가드레일을 규칙으로 굳힌다: HTTP 클라이언트는 fetch 층만 만든다(CLAUDE.md Fetch).
# 어댑터·파이프라인이 직접 요청을 보내면 UA·인코딩·rate limit·robots가 우회된다.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "HTTP는 minjob_agent.fetch 층만 만든다(CLAUDE.md Fetch)."
"requests".msg = "HTTP는 minjob_agent.fetch 층만 만든다(CLAUDE.md Fetch)."
"urllib.request".msg = "HTTP는 minjob_agent.fetch 층만 만든다(CLAUDE.md Fetch)."

[tool.ruff.lint.per-file-ignores]
# fetch 층 자체와 그 테스트는 당연히 HTTP 클라이언트를 쓴다.
"src/minjob_agent/fetch/*" = ["TID251"]
"tests/test_fetch*" = ["TID251"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
# 잘못된 상태를 타입으로 막는다(CLAUDE.md Clean Code) — Any 유입 차단.
disallow_any_explicit = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 설치 없이 클론한 상태에서도 `pytest`가 돌게 한다.
pythonpath = ["src"]
