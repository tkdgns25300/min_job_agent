[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minjob-ingest"
version = "0.0.0"
description = "교역자 청빙 공고 수집 크롤러 (min_job 리뷰 큐 적재)"
requires-python = ">=3.12"
# Pillow는 **인쇄용(CMYK) JPEG 하나 때문에** 있다 — Vertex가 4채널 JPEG를 400으로 거절하고
# (실측 2026-08-14 PCKWORLD/1545·1539), 그 게시판은 본문이 비어 포스터가 곧 공고다.
dependencies = [
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0"]

[project.scripts]
minjob-ingest = "minjob_ingest.cli:main"

# flat 레이아웃(패키지가 리포 루트에) — 배포 라이브러리가 아니라 리포에서 실행하는 앱이라
# `src/` 껍데기를 두지 않는다. 자동 탐색이 config·docs·tests를 패키지로 오인하지 않게 명시한다.
[tool.setuptools.packages.find]
include = ["minjob_ingest*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
#: DTZ = naive datetime 금지. timestamptz 컬럼(SPEC §6)에 로컬시간이 새는 것을 린트로 막는다.
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "RUF", "TID", "DTZ"]

# 가드레일을 규칙으로 굳힌다: HTTP 클라이언트는 fetch 층만 만든다(CLAUDE.md Fetch).
# 어댑터·파이프라인이 직접 요청을 보내면 UA·인코딩·rate limit·robots가 우회된다.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "HTTP는 minjob_ingest.fetch 층만 만든다(CLAUDE.md Fetch)."
"requests".msg = "HTTP는 minjob_ingest.fetch 층만 만든다(CLAUDE.md Fetch)."
"urllib.request".msg = "HTTP는 minjob_ingest.fetch 층만 만든다(CLAUDE.md Fetch)."

[tool.ruff.lint.per-file-ignores]
# fetch 층 자체와, 전송 대역(MockTransport)을 만드는 테스트는 HTTP 클라이언트를 쓴다.
# 실제 요청을 보내는 게 아니라 가짜 응답을 주입하는 용도다.
"minjob_ingest/fetch/*" = ["TID251"]
"tests/test_fetch*" = ["TID251"]
"tests/test_pipeline_*" = ["TID251"]
# ⚠️ **우리 DB는 크롤 대상이 아니다.** fetch 층의 정책(브라우저 UA 위장 · robots
# `Crawl-delay` · 소스별 1.5초 간격)이 PostgREST 요청에 붙으면 행 하나 쓸 때마다 기다리고,
# 우리 DB에 대고 남의 브라우저를 흉내낸다. 그래서 저장소 전송은 별도 창구를 갖는다.
# ⚠️ **파일 하나만 푼다** — `store/*`로 넓히면 `supabase_store.py`가 전송 층을 우회할 수 있다.
# ⚠️ 우리 DB로 가는 HTTP만. 게시판 정책(UA 위장·Crawl-delay·소스별 간격)이 붙으면 안 되는
#    자리라 fetch 층을 지나지 않는다 — `store/transport.py` 주석이 이유를 적어 둔다.
"minjob_ingest/store/transport.py" = ["TID251"]
"minjob_ingest/store/postgrest.py" = ["TID251"]
"minjob_ingest/store/storage.py" = ["TID251"]
"tests/test_store_*" = ["TID251"]
"tests/fake_postgrest.py" = ["TID251"]
"tests/fake_storage.py" = ["TID251"]
"tests/test_supabase_store.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
files = ["minjob_ingest", "tests", "scripts"]
strict = true
# 잘못된 상태를 타입으로 막는다(CLAUDE.md Clean Code) — Any 유입 차단.
disallow_any_explicit = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 설치 없이 클론한 상태에서도 `pytest`가 돌게 한다(패키지가 리포 루트에 있음).
pythonpath = ["."]
