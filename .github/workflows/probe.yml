# 일회성 진단 — 러너에서 막히는 게 DNS인지 IP인지 가른다. 답이 나오면 이 파일은 지운다.
name: 접속 진단

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 러너가 어디서 나가나
        run: |
          echo "공인 IP: $(curl -sS --max-time 10 https://api.ipify.org || echo 실패)"
          echo "기본 리졸버:"; grep -E '^nameserver' /etc/resolv.conf || true

      - name: DNS — 기본 리졸버 vs 공용 리졸버
        run: |
          sudo apt-get install -y -qq dnsutils > /dev/null 2>&1
          for h in daeshin.ac.kr www.kwangshin.ac.kr mokwon.ac.kr; do
            echo "── $h"
            for r in "" "@1.1.1.1" "@8.8.8.8"; do
              # shellcheck disable=SC2086
              out=$(dig +short +time=5 +tries=1 $r "$h" A 2>&1 | head -1)
              echo "   ${r:-기본}  → ${out:-답 없음}"
            done
          done

      - name: TCP·HTTP — **IP를 직접 줘서** 붙나 (DNS 문제와 IP 차단을 가른다)
        run: |
          # 한국에서 실측한 주소를 그대로 준다 — 이름이 안 풀리는 것과 붙지 못하는 것은 다르다.
          probe() {
            host=$1; ip=$2
            code=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 20 -k \
                   --resolve "$host:443:$ip" "https://$host" 2>&1 || echo "연결 실패")
            echo "  $host ($ip) → $code"
          }
          probe daeshin.ac.kr 222.103.156.201
          probe www.kwangshin.ac.kr 123.140.92.18
          probe mokwon.ac.kr 203.230.137.118
          echo "── 포트만 열려 있나 (TCP 443)"
          port_open() {
            timeout 12 bash -c "cat < /dev/null > /dev/tcp/$1/443" 2>/dev/null \
              && echo "  $2 ($1) → TCP 443 열림" || echo "  $2 ($1) → TCP 443 막힘/무응답"
          }
          port_open 222.103.156.201 daeshin
          port_open 123.140.92.18 kwangshin
          port_open 203.230.137.118 mokwon

      - name: 대조 — 잘 되는 게시판도 같은 방식으로
        run: |
          for h in www.pck.or.kr puts.ac.kr; do
            code=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 20 -k \
                   "https://$h" 2>&1 || echo "연결 실패")
            echo "$h  → $code"
          done
