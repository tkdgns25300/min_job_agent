# 하루치 수집 — 러너에서 `daily`를 돌리고 `status`로 결과를 판정한다.
#
# ⚠️ 러너는 끝나면 사라진다(ephemeral). 다음 실행이 이어받는 상태는 전부 Supabase에 있어야
#    하므로 `MINJOB_STORE=supabase`가 필수다. JsonStore로 돌리면 원장이 매 실행 사라져
#    31곳 전량 재크롤 + 전량 재구조화(과금)가 된다.
#
# ⚠️ **cron은 주석 처리해 두었다.** 지금까지 수집은 전부 운영자 PC의 한국 IP에서 했고, 러너는
#    GitHub의 해외 데이터센터 IP다 — 해외 IP를 막는 게시판이 있으면 그곳만 403이 되고 우리는
#    UA를 맞춰도 IP는 바꿀 수 없다. 그래서 **먼저 수동(Run workflow)으로 한 번 돌려**
#    `status`와 로그로 막힌 게시판을 확인하고, 이상 없을 때 아래 `schedule` 두 줄의 주석을 푼다.
name: 하루치 수집

on:
  # schedule:
  #   - cron: "0 22 * * *" # UTC 22:00 = KST 07:00 (전날 올라온 공고를 아침에 집는다)
  workflow_dispatch:
    inputs:
      limit:
        description: "유료 호출 상한(구조화할 공고 수)"
        required: false
        default: "500"
      dry_run:
        description: "수집만 하고 유료 호출·저장은 하지 않는다"
        type: boolean
        required: false
        default: false

# 앞 실행이 아직 돌고 있으면 기다린다. ⚠️ 취소하지 않는다 — 구조화는 글마다 저장하므로
# 중간에 끊으면 이미 과금한 건이 버려질 수 있고, 겹쳐 돌면 같은 게시판에 요청 두 줄기가 흐른다.
concurrency:
  group: crawl
  cancel-in-progress: false

# 리포에 쓸 일이 없다(산출물은 전부 Supabase에 있다).
permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # 2개월 전량이 46분이었다. 하루치는 훨씬 짧지만 게시판이 느릴 때를 감안한다.
    timeout-minutes: 180
    env:
      # ⚠️ 로그가 파이프로 나가면 파이썬이 버퍼링한다 — 진행이 뭉텅이로 늦게 뜨고, 타임아웃으로
      #    죽을 때 **마지막 로그를 잃는다**(어디까지 갔는지가 안 남는다).
      PYTHONUNBUFFERED: "1"
      MINJOB_STORE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERTEX_AI_PROJECT_ID: ${{ secrets.VERTEX_AI_PROJECT_ID }}
      VERTEX_AI_LOCATION: ${{ secrets.VERTEX_AI_LOCATION }}
      VERTEX_AI_CLIENT_EMAIL: ${{ secrets.VERTEX_AI_CLIENT_EMAIL }}
      VERTEX_AI_PRIVATE_KEY: ${{ secrets.VERTEX_AI_PRIVATE_KEY }}
      VERTEX_MODEL: ${{ secrets.VERTEX_MODEL }}
      # ⚠️ `MINJOB_HERESY_REF`는 여기 둘 수 없다 — 경로가 `$RUNNER_TEMP` 안이고 `runner.*`는
      #    job 수준 `env:`에서 쓸 수 없는 컨텍스트다(쓰면 워크플로가 검증에서 거부된다).
      #    아래 단계가 `$GITHUB_ENV`로 다음 단계들에 넘긴다.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # ⚠️ 기본값은 `**/requirements.txt`인데 우리는 그 파일이 없다 — 지정하지 않으면
          #    setup-python이 "찾은 파일 없음"으로 실패한다.
          cache-dependency-path: pyproject.toml

      - name: 설치
        run: python -m pip install --disable-pip-version-check -e .

      - name: 이단 목록을 러너에 둔다
        env:
          HERESY_REF: ${{ secrets.HERESY_REF }}
        run: |
          # ⚠️ 체크아웃 안이 아니라 러너 임시 폴더에 둔다 — 공개 리포의 작업 트리에 실명 자료를
          #    두지 않는다(`.gitignore`가 막고 있지만 애초에 두지 않는 편이 낫다).
          # ⚠️ 내용을 찍지 않는다. `printf '%s'`는 줄바꿈을 덧붙이지 않아 원본과 바이트가 같다.
          ref_path="$RUNNER_TEMP/heresy-ref.json"
          printf '%s' "$HERESY_REF" > "$ref_path"
          if [ ! -s "$ref_path" ]; then
            echo "::error::HERESY_REF 시크릿이 비어 있다 — 목록 없이 돌면 이단 교회 공고가 검수 큐에 올라간다"
            exit 1
          fi
          echo "MINJOB_HERESY_REF=$ref_path" >> "$GITHUB_ENV"
          echo "이단 목록 $(wc -c < "$ref_path")바이트"

      - name: 소스 레지스트리 검사 (무료 · 게시판에 요청하지 않는다)
        run: minjob-ingest list-sources

      - name: Vertex 인증 확인 (💰 호출 1회)
        # ⚠️ 게시판 30곳을 훑기 **전에** 본다. 뒤로 미루면 인증 실수 하나로 수십 분의 게시판
        #    요청을 헛되게 쓰고 나서 실패한다.
        # ⚠️ `dry_run`에서는 건너뛴다 — 미리보기는 **유료 호출 0회**라고 약속한 경로다.
        if: inputs.dry_run != true
        run: minjob-ingest check-gemini

      - name: 하루치 (🌐 게시판 요청 · 💰 유료)
        # ⚠️ 입력은 env로 받는다 — `${{ }}`를 셸 명령에 직접 박으면 입력값이 명령으로 해석된다.
        # cron으로 돌 때는 `inputs`가 비어 있어 기본값(상한 500 · 실제 실행)이 쓰인다.
        env:
          LIMIT: ${{ inputs.limit || '500' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            minjob-ingest daily --limit "$LIMIT" --dry-run
          else
            minjob-ingest daily --limit "$LIMIT"
          fi

      - name: 현황 — 이 종료코드가 워크플로의 성공/실패를 정한다
        # ⚠️ `always()`다 — 위가 실패해도 무엇이 남았는지는 봐야 한다.
        # 빨간불 조건: 죽은 실행 · 게시판 경보 · 포기된 행 · 승인했는데 공개 안 된 행.
        # **검수 대기(PENDING)는 빨간불이 아니다** — 그건 정상 운영이다.
        if: always()
        run: minjob-ingest status
